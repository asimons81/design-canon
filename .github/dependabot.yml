version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Benchmark harness (research/benchmark) pins playwright + chromium
      # revision + SHA256 for reproducible B000 runs. A playwright bump
      # changes the chromium build (1228 -> 1234) and breaks the pin
      # contract by design. Bump deliberately, not via dependabot.
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
